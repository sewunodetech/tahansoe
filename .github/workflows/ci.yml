# CI (ADR 0007). Satu install npm workspaces untuk apps/* dan packages/*.
# engine/ belum menjadi workspace (fase 2) sehingga masih punya job sendiri.
name: CI

on:
  push:
    branches: [master, core-dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspaces:
    name: Workspaces (typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build web
        run: npm run build
        env:
          # Build tidak menghubungi DB; nilai placeholder hanya agar modul bisa dimuat.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          SESSION_SECRET: ci-placeholder-secret-at-least-32-characters

  lint:
    name: Web lint
    runs-on: ubuntu-latest
    # Sementara tidak memblokir: ada error lint lama di dashboard/simulasi
    # (lihat docs/status.md). Hapus baris ini setelah semuanya diperbaiki.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  engine:
    name: Engine (typecheck + test)
    runs-on: ubuntu-latest
    if: ${{ hashFiles('engine/package.json') != '' }}
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  contracts:
    name: Contracts (forge test, tanpa fork)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install dependencies (lib/ di-gitignore)
        run: forge install foundry-rs/forge-std OpenZeppelin/openzeppelin-contracts@v5.1.0 --no-git
      - run: forge build
      # Fork test butuh RPC Arbitrum Sepolia; dijalankan manual / job terpisah dengan secret.
      - run: forge test --no-match-contract Fork -vv
